
name: Build Windows x64

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Source/dsp | Out-Null
          $files = @{ 'PluginProcessor.h'='Source'; 'PluginProcessor.cpp'='Source'; 'PluginEditor.h'='Source'; 'PluginEditor.cpp'='Source'; 'ModernLookAndFeel.h'='Source'; 'MateoEngine.h'='Source/dsp' }
          foreach ($f in $files.Keys) {
            $dest = Join-Path $files[$f] $f
            if (-not (Test-Path $dest)) {
              $p = Get-ChildItem -Recurse -File -Filter $f | Select-Object -First 1
              if ($p) { Copy-Item $p.FullName $dest } else { Write-Error "Brak pliku $f"; exit 1 }
            }
          }

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target MateoHarmonizer_VST3 MateoHarmonizer_Standalone --parallel

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MateoHarmonizer-Windows-x64
          path: |
            build/MateoHarmonizer_artefacts/Release/VST3/
            build/MateoHarmonizer_artefacts/Release/Standalone/
