name: Build Windows x64

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release --target MateoHarmonizer_VST3 MateoHarmonizer_Standalone --parallel

      - name: Upload VST3 + Standalone
        uses: actions/upload-artifact@v4
        with:
          name: MateoHarmonizer-Windows-x64
          path: |
            build/MateoHarmonizer_artefacts/Release/VST3/
            build/MateoHarmonizer_artefacts/Release/Standalone/
